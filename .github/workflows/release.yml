name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to create and release (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Linux Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create and Push Tag (Manual Dispatch Only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TAG=${{ inputs.tag }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            wayland-protocols \
            libvulkan-dev \
            libvulkan1

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --verbose

      - name: Build Release Binary
        run: cargo build --release

      - name: Package Release
        run: |
          mkdir -p dist
          cp target/release/frame dist/
          cp frame.desktop dist/
          cp LICENSE dist/
          tar -czvf frame-linux-x86_64.tar.gz -C dist .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: frame-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-flake:
    name: Update flake.nix version and hash
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake.nix
        run: |
          TAG=${{ inputs.tag || github.ref_name }}
          VERSION=${TAG#v}
          URL="https://github.com/Hy4ri/Frame/releases/download/${TAG}/frame-linux-x86_64.tar.gz"
          # Hash exactly what fetchzip will see, from the published asset
          HASH=$(nix hash convert --hash-algo sha256 --to sri "$(nix-prefetch-url --unpack --type sha256 "$URL")")
          echo "version=$VERSION hash=$HASH"

          sed -i -E \
            -e "s|^(\s*version = )\"[^\"]*\";|\1\"${VERSION}\";|" \
            -e "s|^(\s*hash = )\"sha256-[^\"]*\";|\1\"${HASH}\";|" \
            flake.nix
          grep -nE '^\s*(version|hash) = ' flake.nix

          if git diff --quiet flake.nix; then
            echo "flake.nix already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(nix): update flake to ${TAG}"
          git push origin main
